[package]
name = "cosmic-mac-theme"
version = "0.1.0"
edition = "2024"
description = "Rebuilds the COSMIC light and dark themes with the macOS-like glass settings"

[dependencies]
cosmic-theme = { git = "https://github.com/pop-os/libcosmic", rev = "d922ac380134c00208d2acf93947d44fb217eec5", default-features = false }
cosmic-config = { git = "https://github.com/pop-os/libcosmic", rev = "d922ac380134c00208d2acf93947d44fb217eec5", default-features = false, features = ["macro"] }

[profile.release]
strip = true
