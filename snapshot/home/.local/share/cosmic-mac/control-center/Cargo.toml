[package]
name = "cosmic-mac-control-center"
version = "0.1.0"
edition = "2024"
description = "macOS-style Control Center applet for the COSMIC panel"
license = "GPL-3.0-only"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "d4d71fd53e5ed6bd3a430089114dffa2da3cd498", default-features = false, features = [
    "applet",
    "multi-window",
    "tokio",
    "wayland",
] }
tokio = { version = "1", features = ["process", "time", "fs"] }
# enables the PNG/JPEG decoders for album art in iced's image widget
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = "thin"
strip = true
