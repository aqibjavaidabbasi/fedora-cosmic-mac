<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- COSMIC Mac: use Apple's SF Pro (installed from Apple's SF-Pro.dmg) as the system
     sans-serif, and for web pages that ask for the Apple/system font. Falls back to
     Inter when SF Pro isn't installed. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>SF Pro Text</family><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>SF Pro Text</family><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>-apple-system</family>
    <prefer><family>SF Pro Text</family><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>BlinkMacSystemFont</family>
    <prefer><family>SF Pro Text</family><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>SF Pro</family>
    <prefer><family>SF Pro Text</family><family>Inter</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Helvetica Neue</family>
    <prefer><family>SF Pro Text</family><family>Inter</family></prefer>
  </alias>
</fontconfig>
