[package]
name = "cosmic-mac-autoquit"
version = "0.1.0"
edition = "2024"
description = "Closes apps whose windows have not been focused for a while (battery saver) on COSMIC"

[dependencies]
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4db14c37ed954983158e4055aa94c7741d9" }
libc = "0.2"
serde_json = "1"

[profile.release]
lto = true
strip = true
