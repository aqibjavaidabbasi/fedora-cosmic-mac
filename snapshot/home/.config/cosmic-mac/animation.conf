# Workspace swipe feel for COSMIC (read at login). Log out and back in after changing.
#
# Finger travel needed for a full workspace switch. Higher = the workspace
# follows your fingers more closely (macOS-like). COSMIC's stock value is 150.
COSMIC_MAC_SWIPE_LENGTH=450

# Spring that finishes the switch after you lift your fingers.
# Lower stiffness = softer, longer glide. COSMIC's stock value is 1000.
COSMIC_MAC_SPRING_STIFFNESS=350
# 1.0 = no bounce. Slightly below 1 (e.g. 0.9) adds a tiny macOS-like settle.
COSMIC_MAC_SPRING_DAMPING=1.0

# Mac Spaces: each display has only its desktop workspace plus one workspace per
# maximized app - no spare empty workspace at the end. 0 = COSMIC's normal behaviour.
COSMIC_MAC_SPACES=1
